name: Build EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Build exe
        run: pyinstaller --onefile --windowed --name YT-Downloader app.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: YT-Downloader
          path: dist/YT-Downloader.exe
